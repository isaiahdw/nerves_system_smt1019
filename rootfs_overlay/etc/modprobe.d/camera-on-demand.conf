# The camera pipeline is loaded explicitly by /usr/bin/load-camera-modules,
# and only when the GC5035 sensor probes (some units ship without the
# camera). udev coldplug would otherwise auto-load these from their DT/i2c
# modaliases and resurrect the phantom no-sensor pipeline. udev loads with
# `modprobe -b` which honors this blacklist; the explicit modprobes in
# load-camera-modules don't use -b and are unaffected. rkispp/rkvpss are
# not part of this board's pipeline and are never loaded.
blacklist gc5035
blacklist video_rkcif
blacklist video_rkisp
blacklist video_rkispp
blacklist video_rkvpss
blacklist phy_rockchip_csi2_dphy
blacklist phy_rockchip_csi2_dphy_hw
