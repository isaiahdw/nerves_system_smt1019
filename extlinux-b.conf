# NOTE: under the phase-2 U-Boot this is the FALLBACK boot path — bootcmd runs
# nerves_boot first and only sysboots this extlinux config if that fails.
# extlinux configuration booting firmware slot B
#
# See extlinux-a.conf for details. Keep the two files in sync except for the
# kernel name and root= device.
DEFAULT nerves-b
TIMEOUT 10

LABEL nerves-b
    KERNEL /Image.b
    FDT /rk3576-smt1019.dtb
    APPEND console=ttyFIQ0 console=tty1 root=/dev/mmcblk0p3 rootfstype=squashfs rootwait
