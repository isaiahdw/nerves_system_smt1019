# Playback routing for the SMT1019. card0 = ES8323 codec, card1 = PDM mic.
#
# Two playback paths share one dmix (so they mix in hardware):
#
#   MEDIA  (music / test sounds, via `default`):
#     app -> plug -> ladspa(voicing) -> plug -> softvol(Media Volume) -> dmix -> hw
#          the device-volume slider is the softvol; only media is affected.
#
#   SFX    (UI clicks / alert chimes, via `sfx`):
#     sound -> plug -> dmix -> hw
#          NO voicing, NO softvol -> a FIXED, constant level regardless of the
#          device volume. It just mixes over whatever media is playing.
#
# The codec's master PCM Volume (numid 56) should be pinned to a fixed
# reference by the app (it is post-mix and would otherwise scale the sfx path
# too); "device volume" lives entirely in the software `Media Volume` softvol.
#
# Voicing controls order (see package/smt-audio-dsp):
#   [ cutoff_Hz warmth_Hz warmth_dB presence_Hz presence_Q presence_dB
#     air_Hz air_dB makeup_dB ceiling ]
#
# 2026-07-23 numbers came from closed-loop measurement (panel playing stepped
# tones + pink noise, measured with a flat-ish external mic, FFT/third-octave
# analysis): the driver radiates nothing meaningful below ~500 Hz (86% THD at
# 300 Hz -> HPF at 400), and has a violent ~+20 dB resonance at 2.8-4 kHz
# (-5 dB wide cut at 3.6k). Result verified ~±3 dB in-room 630 Hz-8 kHz with
# a gentle warm tilt. Makeup 8 dB / ceiling 0.95 validated clean by ear.

# Use libsamplerate for all rate conversion (44.1k media -> 48k chain);
# the built-in linear converter audibly aliases.
defaults.pcm.rate_converter "samplerate_medium"

pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

# Software device volume — MEDIA ONLY.
pcm.mediavol {
    type softvol
    slave.pcm "dmixer"
    control { name "Media Volume"; card 0 }
    min_dB -50.0
    max_dB 0.0
    resolution 101
}
pcm.mediavol_plug {
    type plug
    slave.pcm "mediavol"
}

# Voicing (HPF + 3-band EQ + soft limiter); float, so plug-wrapped into softvol.
pcm.voiced {
    type ladspa
    slave.pcm "mediavol_plug"
    path "/usr/lib/ladspa"
    playback_plugins [
        {
            label smt_hpf_limiter
            input {
                controls [ 400  500 0.0  3600 1.6 -5.0  7000 -1.5  8.0  0.95 ]
            }
        }
    ]
}

# MEDIA default path.
pcm.!default {
    type plug
    slave.pcm "voiced"
}

# SFX path — fixed level, straight to the mixer.
pcm.sfx {
    type plug
    slave.pcm "dmixer"
}

ctl.!default {
    type hw
    card 0
}
