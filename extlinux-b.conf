# NOTE: this is the manual-recovery FALLBACK boot path — the committed U-Boot
# boots via nerves_init/nerves_boot from the saved env; only when the saved
# env is missing or corrupt does the compiled-in default (distro boot) load
# this extlinux config.
# extlinux configuration booting firmware slot B
#
# See extlinux-a.conf for details. Keep the two files in sync except for the
# kernel name and root= device.
DEFAULT nerves-b
TIMEOUT 10

LABEL nerves-b
    KERNEL /Image.b
    FDT /rk3576-smt1019.b.dtb
    APPEND console=ttyFIQ0 console=tty1 root=/dev/mmcblk0p3 rootfstype=squashfs rootwait
