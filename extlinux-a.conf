# NOTE: this is the manual-recovery FALLBACK boot path — the committed U-Boot
# boots via nerves_init/nerves_boot from the saved env; only when the saved
# env is missing or corrupt does the compiled-in default (distro boot) load
# this extlinux config.
# extlinux configuration booting firmware slot A
#
# The vendor U-Boot's distro boot scans the FAT boot partition for
# extlinux/extlinux.conf. Firmware upgrades swap this file between the
# slot A and slot B variants — the kernel name, dtb name, and root=
# differ (kernel AND dtb are per-slot so a reverted upgrade never mixes
# versions).
#
# console=ttyFIQ0 is confirmed correct: the vendor defconfig enables the FIQ
# debugger console by default. If serial output is missing, compare against
# `cat /proc/cmdline` on the Debian install for earlycon/baud extras.
DEFAULT nerves-a
TIMEOUT 10

LABEL nerves-a
    KERNEL /Image.a
    FDT /rk3576-smt1019.a.dtb
    APPEND console=ttyFIQ0 console=tty1 root=/dev/mmcblk0p2 rootfstype=squashfs rootwait
