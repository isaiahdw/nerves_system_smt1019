# Firmware configuration file for the SMT1019 (RK3576)
#
# Phase 1 boot flow (vendor U-Boot from the Debian image, written as prebuilt
# blobs): boot ROM -> idbloader.img -> u-boot.itb -> distro boot finds
# extlinux/extlinux.conf on p1 -> loads Image.<slot> + dtb -> squashfs rootfs.
#
# A/B slot selection works by rewriting extlinux/extlinux.conf to point at the
# other slot during an upgrade. Automatic revert-on-boot-failure requires the
# phase 2 custom U-Boot (see uboot/uboot.env). The Nerves U-Boot environment
# block is still maintained so nerves_runtime metadata and `fwup` upgrade
# gating work exactly like other Nerves systems.

require-fwup-version="1.12.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

# File resources are listed in the order that they are included in the .fw file
# This is important, since this is the order that they're written on a firmware
# update due to the event driven nature of the update system.
file-resource idbloader.img {
    host-path = "${NERVES_SYSTEM}/images/idbloader.img"
}
# Phase-2 U-Boot: reads the Nerves env from MMC and does A/B boot with
# automatic revert. See uboot/README.md.
file-resource u-boot.itb {
    host-path = "${NERVES_SYSTEM}/images/u-boot-env.itb"
}
file-resource uboot-env.bin {
    host-path = "${NERVES_SYSTEM}/images/uboot-env.bin"
}
file-resource Image {
    host-path = "${NERVES_SYSTEM}/images/Image"
}
# This must match BR2_LINUX_KERNEL_INTREE_DTS_NAME in nerves_defconfig.
# Written to the FAT partition PER SLOT (rk3576-smt1019.a.dtb / .b.dtb),
# like Image.<slot>: an upgrade must never mutate the dtb the fallback
# slot boots with, or a reverted upgrade would run the old kernel against
# the new device tree. (Known exception: the resource partition carries
# its own dtb copy for U-Boot's display bring-up and IS shared between
# slots — a revert keeps the new resource content, affecting only
# U-Boot-time display/splash, not the booted kernel.)
file-resource devicetree.dtb {
    host-path = "${NERVES_SYSTEM}/images/rk3576s-r157-v2.0-wf1019-linux.dtb"
}
file-resource extlinux-a.conf {
    host-path = "${NERVES_SYSTEM}/images/extlinux-a.conf"
}
file-resource extlinux-b.conf {
    host-path = "${NERVES_SYSTEM}/images/extlinux-b.conf"
}
# Packed by post-createfs.sh with resource_tool (kernel dtb + splash BMPs).
file-resource resource.img {
    host-path = "${NERVES_SYSTEM}/images/resource.img"
    assert-size-lte = ${RESOURCE_PART_COUNT}
}
file-resource rootfs.img {
    host-path = ${ROOTFS}

    # Error out if the rootfs size exceeds the partition size
    assert-size-lte = ${ROOTFS_A_PART_COUNT}
}

gpt gpt {
    guid = ${DISK_UUID}

    partition 0 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${BOOT_PART_GUID}
        # NOT named "boot": the vendor U-Boot's bootcmd tries boot_fit/bootrkp
        # against a partition named "boot" before falling back to distro boot.
        # With no "boot"/"misc" partitions those fail instantly and extlinux
        # boot proceeds.
        name = "bootfs"
    }
    partition 1 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_A_PART_GUID}
        name = "rootfs_a"
    }
    partition 2 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${ROOTFS_B_PART_GUID}
        name = "rootfs_b"
    }
    # Vendor U-Boot boot-splash source: resource.img with the kernel dtb and
    # logo BMPs. GPT name must be exactly "resource" (that is how U-Boot's
    # resource_scan finds it). fwup requires the expand partition to be
    # declared last, so resource is entry 3 and app moves to entry 4
    # (/dev/mmcblk0p5, see NERVES_FW_APPLICATION_PART0_DEVPATH).
    partition 3 {
        block-offset = ${RESOURCE_PART_OFFSET}
        block-count = ${RESOURCE_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${RESOURCE_PART_GUID}
        name = "resource"
    }
    partition 4 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${APP_PART_GUID}
        name = "app"
        expand = true
    }
}

# Location where installed firmware information is stored.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# This firmware task writes everything to the destination media.
# This should only be run at the factory to initialize a board!
task complete {
    # Only match if not mounted
    require-unmounted-destination = true

    on-init {
        gpt_write(gpt)

        fat_mkfs(${BOOT_PART_OFFSET}, ${BOOT_PART_COUNT})
        fat_setlabel(${BOOT_PART_OFFSET}, "BOOT")
        fat_mkdir(${BOOT_PART_OFFSET}, "extlinux")
    }

    on-resource idbloader.img { raw_write(${IDBLOADER_OFFSET}) }
    on-resource u-boot.itb { raw_write(${UBOOT_ITB_OFFSET}) }
    on-resource Image { fat_write(${BOOT_PART_OFFSET}, "Image.a") }
    on-resource devicetree.dtb { fat_write(${BOOT_PART_OFFSET}, "rk3576-smt1019.a.dtb") }
    on-resource resource.img { raw_write(${RESOURCE_PART_OFFSET}) }
    on-resource extlinux-a.conf { fat_write(${BOOT_PART_OFFSET}, "extlinux/extlinux.conf") }

    on-resource uboot-env.bin {
        # Boot to the A partition first and don't fail back.
        # If this fails, we bricked the board with no recovery.
        raw_write(${UBOOT_ENV_OFFSET})

        # Include provisioning instructions
        include("${NERVES_PROVISIONING}")

        # Add in the generic Nerves metadata variables.
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_devpath", ${NERVES_FW_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")
    }
    on-resource rootfs.img {
        # write to the first rootfs partition
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Clear out any old data in the B partition that might be mistaken for
        # a file system. This is mostly to avoid confusion in humans when
        # reprogramming SDCards with unknown contents.
        raw_memset(${ROOTFS_B_PART_OFFSET}, 256, 0xff)

        # Invalidate the application data partition so that it is guaranteed to
        # trigger the corrupt filesystem detection code on first boot and get
        # formatted. If this isn't done and an old SDCard is reused, the
        # application data could be in a weird state.
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

task upgrade.a {
    # This task upgrades the A partition
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Require that the running version of firmware has been validated.
    # If it has not, then failing back is not guaranteed to work.
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition A")

        # Clear some firmware information just in case this update gets
        # interrupted midway. If this partition was bootable, it's not going to
        # be soon.
        uboot_unsetenv(uboot-env, "a.nerves_fw_version")
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "a.nerves_fw_uuid")

        # Indicate that the entire partition can be cleared
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
    }

    # Write the new kernel and rootfs. The extlinux.conf swap below is what
    # actually redirects the next boot to slot A (vendor U-Boot doesn't read
    # the Nerves environment block in phase 1).
    on-resource Image {
        delta-source-fat-offset=${BOOT_PART_OFFSET}
        delta-source-fat-path="Image.b"
        fat_write(${BOOT_PART_OFFSET}, "Image.a")
    }
    on-resource devicetree.dtb {
        delta-source-fat-offset=${BOOT_PART_OFFSET}
        delta-source-fat-path="rk3576-smt1019.b.dtb"
        fat_write(${BOOT_PART_OFFSET}, "rk3576-smt1019.a.dtb")
    }
    on-resource extlinux-a.conf { fat_write(${BOOT_PART_OFFSET}, "extlinux/extlinux.conf") }
    on-resource resource.img {
        delta-source-raw-offset=${RESOURCE_PART_OFFSET}
        delta-source-raw-count=${RESOURCE_PART_COUNT}
        raw_write(${RESOURCE_PART_OFFSET})
    }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_B_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_B_PART_COUNT}
        raw_write(${ROOTFS_A_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "a.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "a.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "a.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "a.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "a.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "a.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "a.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "a.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "a.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "a.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to A next time.
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
    }

    on-error {
    }
}

task upgrade.b {
    # This task upgrades the B partition
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")

    # Verify the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Upgrading partition B")

        # Clear some firmware information just in case this update gets
        # interrupted midway.
        uboot_unsetenv(uboot-env, "b.nerves_fw_version")
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")
        uboot_unsetenv(uboot-env, "b.nerves_fw_uuid")

        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
    }

    on-resource Image {
        delta-source-fat-offset=${BOOT_PART_OFFSET}
        delta-source-fat-path="Image.a"
        fat_write(${BOOT_PART_OFFSET}, "Image.b")
    }
    on-resource devicetree.dtb {
        delta-source-fat-offset=${BOOT_PART_OFFSET}
        delta-source-fat-path="rk3576-smt1019.a.dtb"
        fat_write(${BOOT_PART_OFFSET}, "rk3576-smt1019.b.dtb")
    }
    on-resource extlinux-b.conf { fat_write(${BOOT_PART_OFFSET}, "extlinux/extlinux.conf") }
    on-resource resource.img {
        delta-source-raw-offset=${RESOURCE_PART_OFFSET}
        delta-source-raw-count=${RESOURCE_PART_COUNT}
        raw_write(${RESOURCE_PART_OFFSET})
    }
    on-resource rootfs.img {
        delta-source-raw-offset=${ROOTFS_A_PART_OFFSET}
        delta-source-raw-count=${ROOTFS_A_PART_COUNT}
        raw_write(${ROOTFS_B_PART_OFFSET})
    }

    on-finish {
        # Update firmware metadata
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_devpath", ${NERVES_FW_APPLICATION_PART0_DEVPATH})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_fstype", ${NERVES_FW_APPLICATION_PART0_FSTYPE})
        uboot_setenv(uboot-env, "b.nerves_fw_application_part0_target", ${NERVES_FW_APPLICATION_PART0_TARGET})
        uboot_setenv(uboot-env, "b.nerves_fw_product", ${NERVES_FW_PRODUCT})
        uboot_setenv(uboot-env, "b.nerves_fw_description", ${NERVES_FW_DESCRIPTION})
        uboot_setenv(uboot-env, "b.nerves_fw_version", ${NERVES_FW_VERSION})
        uboot_setenv(uboot-env, "b.nerves_fw_platform", ${NERVES_FW_PLATFORM})
        uboot_setenv(uboot-env, "b.nerves_fw_architecture", ${NERVES_FW_ARCHITECTURE})
        uboot_setenv(uboot-env, "b.nerves_fw_author", ${NERVES_FW_AUTHOR})
        uboot_setenv(uboot-env, "b.nerves_fw_vcs_identifier", ${NERVES_FW_VCS_IDENTIFIER})
        uboot_setenv(uboot-env, "b.nerves_fw_misc", ${NERVES_FW_MISC})
        uboot_setenv(uboot-env, "b.nerves_fw_uuid", "\${FWUP_META_UUID}")

        # Reset the validation status and boot to B next time.
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "0")
        uboot_setenv(uboot-env, "nerves_fw_booted", "0")
    }

    on-error {
    }
}

task upgrade.unvalidated {
    require-uboot-variable(uboot-env, "nerves_fw_validated", "0")

    on-init {
        error("Please validate the running firmware before upgrading it again.")
    }
}

task upgrade.unexpected {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        error("Please check the media being upgraded. It doesn't look like either the A or B partitions are active.")
    }
}

task upgrade.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

task provision {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        include("${NERVES_PROVISIONING}")
    }
}
task provision.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}
